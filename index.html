<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Run Constellation from the Stacks: take in arrivals, send squads into the fog, and decide which Truths the Archive records.">
  <title>Constellation Command</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles/main.css">
  <script>
    // Collect errors early (before modules load) so headless checks and
    // ?debug runs can read them from #error-log.
    window.__errors = [];
    (function () {
      function report(msg) {
        window.__errors.push(String(msg));
        var el = document.getElementById('error-log');
        if (el) { el.textContent = window.__errors.join('\n'); el.dataset.count = window.__errors.length; }
        document.documentElement.dataset.errors = window.__errors.length;
      }
      window.__reportError = report;
      window.addEventListener('error', function (e) {
        report(e.message ? e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') : 'resource failed: ' + ((e.target && (e.target.src || e.target.href)) || '?'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { report('unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      var consoleError = console.error;
      console.error = function () { report('console.error: ' + Array.prototype.join.call(arguments, ' ')); return consoleError.apply(console, arguments); };
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</head>

      <symbol id="i-resonance" viewBox="0 0 24 24"><path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

    </defs>
  </svg>
  <div id="app" class="app" data-screen="loading">
    <header class="topbar" id="topbar"></header>
    <main id="screen" class="screen" tabindex="-1">
      <noscript><p class="pad">Constellation Command needs JavaScript to run.</p></noscript>
      <p class="pad loading" id="loading">The bell is about to ring…</p>
    </main>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <pre id="error-log" class="error-log" hidden></pre>
</body>
</html>
